</defs><rect width="1000" height="550" fill="#202122"/><g data-space-id="legend" data-icon-kind="lamp" data-icon-marker="" data-icon-count="1" data-x="10" data-y="40" transform="translate(100 400)" color="#9ccbdc"><title>등불 1개</title><circle r="47" fill="#171819" fill-opacity=".62" stroke="currentColor" stroke-width="5" stroke-opacity=".65"/><circle r="39" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><use opacity=".68" href="#icon-lamp"/></g><g data-space-id="legend" data-icon-kind="consumable" data-icon-marker="" data-icon-count="1" data-x="30" data-y="40" transform="translate(300 400)" color="#a8c098"><title>소모품 1개</title><circle r="47" fill="#171819" fill-opacity=".62" stroke="currentColor" stroke-width="5" stroke-opacity=".65"/><circle r="39" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><use opacity=".68" href="#icon-chest"/></g><g data-space-id="legend" data-icon-kind="spawn" data-icon-marker="red" data-icon-count="1" data-x="50" data-y="40" transform="translate(500 400)" color="#ce786f"><title>빨강 적 출현 1개</title><circle r="47" fill="#171819" fill-opacity=".62" stroke="currentColor" stroke-width="5" stroke-opacity=".65"/><circle r="39" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><use opacity=".68" href="#icon-red"/></g><g data-space-id="legend" data-icon-kind="spawn" data-icon-marker="gold" data-icon-count="1" data-x="70" data-y="40" transform="translate(700 400)" color="#c9ae75"><title>황갈색 적 출현 1개</title><circle r="47" fill="#171819" fill-opacity=".62" stroke="currentColor" stroke-width="5" stroke-opacity=".65"/><circle r="39" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><use opacity=".68" href="#icon-gold"/></g><g data-space-id="legend" data-icon-kind="spawn" data-icon-marker="purple" data-icon-count="1" data-x="90" data-y="40" transform="translate(900 400)" color="#b29ac8"><title>자주 적 출현 1개</title><circle r="47" fill="#171819" fill-opacity=".62" stroke="currentColor" stroke-width="5" stroke-opacity=".65"/><circle r="39" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><use opacity=".68" href="#icon-purple"/></g><g fill="#e4dfd2" text-anchor="middle" font-size="29" font-family="Malgun Gothic,Arial,sans-serif"><text x="100" y="510">등불</text><text x="300" y="510">소모품</text><text x="500" y="510">빨강 출현</text><text x="700" y="510">황갈색 출현</text><text x="900" y="510">자주 출현</text></g><g fill="#e4dfd2" font-size="32" font-family="Malgun Gothic,Arial,sans-serif"><path d="M70 80H210" stroke="#e4dece" stroke-width="9"/><text x="245" y="91">칸 경계 · 맞닿은 칸으로 이동</text><path d="M70 145V205H210V145" fill="none" stroke="#d8c6a1" stroke-width="7"/><text x="245" y="184">출입구 · 인접 타일과 연결</text><text x="70" y="285">기호가 두 개면 해당 소모품·적도 두 개</text></g></svg>
