<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>사냥꾼의 카드 안내</title>
    <link rel="stylesheet" href="fonts/noto-sans-kr.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    <header><a href="hunt.html">← 사냥으로 돌아가기</a><a href="guide.html">플레이 안내</a></header>
    <main>
      <p class="eyebrow">HUNTER'S INVENTORY</p>
      <h1>사냥꾼의 카드</h1>
      <p class="lead">스탯 카드와 소모품의 효과를 확인하세요.</p>
      <p class="notice">임무 중 얻은 보상과 물품은 사냥 화면의 보유 목록에서 확인할 수 있습니다.</p>
      <section class="toolbar">
        <label>카드 검색<input id="query" type="search" placeholder="이름, 효과, 사용 시점" /></label>
        <label>분류<select id="group"><option value="all">전체</option><option value="basic">기본 스탯</option><option value="consumable">소모품</option><option value="upgrade">업그레이드</option></select></label>
      </section>
      <p id="resultCount" role="status"></p>
      <div id="cards" class="catalog-grid"></div>
    </main>
    <script src="components/cards.js"></script>
    <script src="components.js"></script>
  </body>
</html>
