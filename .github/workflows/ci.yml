name: Game regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run game regression tests
        run: node scripts/test-ci.cjs
      - name: Keep actual test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-regression-results
          path: test-results/
          if-no-files-found: error
          retention-days: 30
